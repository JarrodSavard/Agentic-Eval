[project]
name = "observatory-eval"
version = "0.1.0"
description = "A tiny, reproducible agent reliability testbed"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "openai>=2.54,<3", "anthropic>=0.121,<1", "python-dotenv>=1,<2"]

[project.scripts]
observatory = "observatory.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "hypothesis>=6,<7", "httpx>=0.28,<1", "ruff>=0.12", "mypy>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/observatory"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["observatory"]
mypy_path = "engine"
