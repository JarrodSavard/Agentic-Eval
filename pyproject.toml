[project]
name = "observatory-eval"
version = "0.1.0"
description = "A tiny, reproducible agent reliability testbed"
authors = [{name = "Jarrod Savard"}]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "openai>=2.54,<3",
    "anthropic>=0.121,<1",
    "python-dotenv>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
observatory = "observatory.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "hypothesis>=6,<7",
    "httpx>=0.28,<1",
    "ruff>=0.12",
    "mypy>=1.18",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/observatory"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
pythonpath = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["observatory"]
mypy_path = "engine"
